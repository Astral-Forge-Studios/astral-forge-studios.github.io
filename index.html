<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>3D Shooter s boty</title>
  <style>body { margin:0; overflow:hidden; }</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
// --- SCÉNA A KAMERA ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --- SVĚTLO ---
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

// --- MAPA (podlaha) ---
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({ color: 0x555555 })
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// --- HRÁČ (kostka) ---
const player = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({ color: 0x00ff00 })
);
player.position.y = 0.5;
scene.add(player);

// --- BOTI (červené kostky) ---
const bots = [];
for(let i=0;i<5;i++){
  const bot = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({ color: 0xff0000 })
  );
  bot.position.set(Math.random()*20-10,0.5,Math.random()*20-10);
  scene.add(bot);
  bots.push(bot);
}

// --- POHYB HRÁČE (WASD) ---
let keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function movePlayer(){
  if(keys["w"]) player.position.z -= 0.2;
  if(keys["s"]) player.position.z += 0.2;
  if(keys["a"]) player.position.x -= 0.2;
  if(keys["d"]) player.position.x += 0.2;
}

// --- BOT AI (chodí směrem k hráči) ---
function moveBots(){
  bots.forEach(bot => {
    const dx = player.position.x - bot.position.x;
    const dz = player.position.z - bot.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if(dist>0.5){
      bot.position.x += 0.01*dx/dist;
      bot.position.z += 0.01*dz/dist;
    }
  });
}

// --- KAMERA ---
camera.position.y = 5;
camera.position.z = 10;

// --- ANIMACE ---
function animate(){
  requestAnimationFrame(animate);
  movePlayer();
  moveBots();
  camera.position.x = player.position.x;
  camera.position.z = player.position.z + 10;
  camera.lookAt(player.position.x, player.position.y, player.position.z);
  renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DopamineFM</title>
</head>

<body style="background:#111;color:white;font-family:Arial;text-align:center;padding-top:40px;">

  <h1>🎧 DopamineFM</h1>
  <p>Hudba, která ti zvedne náladu</p>

  <audio controls autoplay style="width:300px;">
    <source src="https://icecast.beatzone.cz/radio/8500/radio.mp3" type="audio/mpeg">
  </audio>

  <h2>🔴 NOW PLAYING</h2>
  <div id="now">Načítám...</div>

  <h3>🎵 Playlist</h3>
  <ul id="playlist"></ul>

  <script src="playlist.js"></script>

  <script>
    // ZOBRAZENÍ PLAYLISTU
    const list = document.getElementById("playlist");

    playlist.forEach(song => {
      const li = document.createElement("li");
      li.textContent = song;
      list.appendChild(li);
    });

    // NOW PLAYING (simulace každých 5 sekund)
    const now = document.getElementById("now");
    let i = 0;

    function updateNowPlaying() {
      now.textContent = playlist[i];
      i = (i + 1) % playlist.length;
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, 5000);
  </script>

</body>
</html>

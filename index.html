<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist FPS Game</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { background: #000; display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Game variables
        let player = { x: canvas.width / 2, y: canvas.height / 2, width: 30, height: 30, health: 100, ammo: 30, kills: 0 };
        let bots = [];
        let bullets = [];
        
        // Create bots
        function createBots(num) {
            for (let i = 0; i < num; i++) {
                bots.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, width: 30, height: 30, health: 50 });
            }
        }
        
        createBots(5);
        
        // Control player
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'w': player.y -= 5; break;
                case 's': player.y += 5; break;
                case 'a': player.x -= 5; break;
                case 'd': player.x += 5; break;
            }
        });
        
        // Aim and shoot
        window.addEventListener('click', () => {
            if (player.ammo > 0) {
                bullets.push({ x: player.x + player.width / 2, y: player.y, dx: 0, dy: -5 });
                player.ammo--;
            }
        });
        
        // Game loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw player
            ctx.fillStyle = 'blue';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Draw bots
            bots.forEach(bot => {
                ctx.fillStyle = 'red';
                ctx.fillRect(bot.x, bot.y, bot.width, bot.height);
            });
            // Draw bullets
            bullets.forEach((bullet, index) => {
                bullet.y += bullet.dy;
                ctx.fillStyle = 'yellow';
                ctx.fillRect(bullet.x, bullet.y, 5, 5);
                // Check for collision with bots
                bots.forEach((bot, bIndex) => {
                    if (bullet.x < bot.x + bot.width && bullet.x + 5 > bot.x &&
                        bullet.y < bot.y + bot.height && bullet.y + 5 > bot.y) {
                        bot.health -= 20;
                        bullets.splice(index, 1);
                        if (bot.health <= 0) {
                            bots.splice(bIndex, 1);
                            player.kills++;
                        }
                    }
                });
                // Remove bullet if out of bounds
                if (bullet.y < 0) {
                    bullets.splice(index, 1);
                }
            });
            // Draw HUD
            ctx.fillStyle = 'white';
            ctx.fillText(`Health: ${player.health}`, 10, 20);
            ctx.fillText(`Ammo: ${player.ammo}`, 10, 40);
            ctx.fillText(`Kills: ${player.kills}`, 10, 60);
            
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
    </script>
</body>
</html>

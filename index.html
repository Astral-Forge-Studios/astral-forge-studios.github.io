<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOPAMINE Radio | Live Stream</title>
    <style>
        /* Moderní tmavý vzhled */
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Styl pro název rádia */
        h1 {
            font-size: 3rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ff00cc, #3333ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 20px rgba(255, 0, 204, 0.3);
        }

        p {
            color: #888;
            margin-bottom: 30px;
        }

        /* Kontejnér pro přehrávač */
        .player-container {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        /* Styl pro samotný iframe */
        iframe {
            border: none;
            border-radius: 10px;
            width: 100%;
            height: 100px; /* Uprav výšku podle toho, jak vypadá přehrávač Beazone */
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #444;
        }
    </style>
</head>
<body>

    <h1>DOPAMINE</h1>
    <p>DOPAMINE | Tvoje denní dávka hudební energie. Fresh tracky 24/7.</p>

    <div class="player-container">
        <iframe src="https://icecast.beatzone.cz/radio/8500/radio.mp3" scrolling="no"></iframe>
    </div>

    <div class="footer">
        &copy; 2026 DOPAMINE Radio. Všechna práva vyhrazena.
    </div>

</body>
</html>

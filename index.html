<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found</title>
    <style>
        body {
            background-color: #f4f4f9;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 5rem;
            margin: 0;
            color: #ff4757;
        }
        p {
            font-size: 1.5rem;
            margin: 10px 0;
        }
        .error-msg {
            color: #747d8c;
            font-style: italic;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #2f3542;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #57606f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Oops!</h1>
        <p>This page is not available right now.</p>
        <p class="error-msg">error: This page is now off :(</p>
       </div>
</body>
</html>
